<!DOCTYPE html>
<!--
  主題頁模板（某主題的課程列表）——樣式都在 /shared/topic.css（全站一份）。
  用法：cp 到 content/<topic-slug>/index.html 後修改（slug 用簡短英文，如 ml-basics）。
  - 課程卡「越新越上」：新課一律插在 .lessons 最前面
  - 規劃中的課用 .card.soon 佔位卡（虛線框＋降透明度＋不可點）
  - 新主題上線時：把主題卡插進 content/index.html 首頁的 .lessons 最前面，
    並維護主題卡上的課程數字（TOPIC · N 門課）
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主題名稱 · AI 互動教室</title>
<meta name="description" content="一句話主題簡介（搜尋結果與分享預覽會用到）">
<link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="主題名稱 · AI 互動教室">
<meta property="og:description" content="一句話主題簡介（搜尋結果與分享預覽會用到）">
<meta property="og:url" content="https://class.itsmygo.uk/TOPIC_SLUG/">
<meta property="og:image" content="https://class.itsmygo.uk/shared/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/shared/topic.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 回主題列表</a>
  <span class="eyebrow">TOPIC · ENGLISH NAME</span>
  <h1>🧠 主題名稱</h1>
  <p class="sub">
    主題簡介：這個主題的學習路線一句話講清楚。
  </p>

  <!-- 課程卡片：越新的課放越上面（新增課程一律插在最前面） -->
  <div class="lessons">
    <a class="card" href="/LESSON_ID/">
      <span class="tag">軌道名 · 01</span>
      <h2>🌳 課名：課卡文案是賣點不是摘要</h2>
      <p>一句話讓人想點進去，再補一句課程亮點（互動數、挑戰數）。</p>
      <span class="go">開始上課 →</span>
    </a>
    <div class="card soon">
      <span class="tag">軌道名 · 即將開課</span>
      <h2>📈 規劃中課名</h2>
      <p>規劃中課程的一句話賣點。</p>
    </div>
  </div>

  <footer>
    <a href="https://www.youtube.com/@itsmygouk" target="_blank" rel="noopener">YouTube 頻道</a> ·
    <a href="https://blog.itsmygo.uk/" target="_blank" rel="noopener">部落格</a>
  </footer>
</div>
</body>
</html>
